<svg xmlns="http://www.w3.org/2000/svg" width="620" height="310" viewBox="0 0 620 310"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b8dd9"/>
    </marker>
  </defs>
  <rect width="620" height="310" fill="white"/>

  <!-- main.rs -->
  <rect x="20" y="18" width="580" height="52" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="310" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">main.rs</text>
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="#4a5568">CLI parsing · initialization · signal handling</text>

  <!-- main.rs → backend/ -->
  <line x1="160" y1="70" x2="160" y2="118" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- main.rs → cups/ -->
  <line x1="460" y1="70" x2="460" y2="118" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- backend/ -->
  <rect x="40" y="120" width="240" height="52" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="160" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">backend/</text>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#4a5568">(Hardware)</text>

  <!-- cups/ -->
  <rect x="340" y="120" width="240" height="52" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="460" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">cups/</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#4a5568">(Remote cfg)</text>

  <!-- backend/ → lns/ -->
  <line x1="160" y1="172" x2="160" y2="236" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="209" font-size="11" font-style="italic" fill="#4a5568">UplinkFrame / DownlinkFrame</text>

  <!-- cups/ → lns/ -->
  <line x1="460" y1="172" x2="460" y2="236" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="468" y="209" font-size="11" font-style="italic" fill="#4a5568">TC URI / creds</text>

  <!-- lns/ -->
  <rect x="40" y="238" width="540" height="52" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="310" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">lns/</text>
  <text x="310" y="278" text-anchor="middle" font-size="12" fill="#4a5568">BasicStation protocol · WebSocket · TLS</text>
</svg>
