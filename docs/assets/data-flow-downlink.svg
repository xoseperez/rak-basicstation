<svg xmlns="http://www.w3.org/2000/svg" width="580" height="554" viewBox="0 0 580 554"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b8dd9"/>
    </marker>
  </defs>
  <rect width="580" height="554" fill="white"/>

  <!-- Network Server -->
  <rect x="80" y="20" width="420" height="44" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="290" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">Network Server</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="64" x2="290" y2="106" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="90" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5568">dnmsg / dnsched WebSocket message</text>

  <!-- lns/websocket.rs (demux) -->
  <rect x="80" y="114" width="420" height="44" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="290" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2a3a">lns/websocket.rs</text>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#4a5568">message demultiplexer</text>

  <!-- Arrow 2 (no label) -->
  <line x1="290" y1="158" x2="290" y2="200" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- lns/downlink.rs -->
  <rect x="80" y="208" width="420" height="44" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="290" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2a3a">lns/downlink.rs</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#4a5568">handle_dnmsg() / handle_dnsched()</text>

  <!-- Arrow 3 -->
  <line x1="290" y1="252" x2="290" y2="294" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="278" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5568">builds gw::DownlinkFrame (protobuf)</text>

  <!-- backend::send_downlink_frame() -->
  <rect x="80" y="302" width="420" height="44" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="290" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">backend::send_downlink_frame()</text>

  <!-- Arrow 4 -->
  <line x1="290" y1="346" x2="290" y2="388" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="372" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5568">ZMQ REQ/REP / UDP PULL_RESP</text>

  <!-- Hardware -->
  <rect x="80" y="396" width="420" height="44" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="290" y="423" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e2a3a">Hardware</text>

  <!-- Arrow 5 -->
  <line x1="290" y1="440" x2="290" y2="482" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="466" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5568">TX ACK</text>

  <!-- lns/websocket.rs (dntxed) -->
  <rect x="80" y="490" width="420" height="44" rx="4" fill="#f0f4fb" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="290" y="507" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e2a3a">lns/websocket.rs</text>
  <text x="290" y="524" text-anchor="middle" font-size="11" fill="#4a5568">sends dntxed confirmation</text>
</svg>
